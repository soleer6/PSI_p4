services:
  - type: web
    name: songproject
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn songproject.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
